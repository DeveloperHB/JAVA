<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>User Profile</title>
</head>
<body>
<h1>User Profile</h1>
<form th:action="@{/profile/update}" th:object="${user}" method="post">
  <label for="username">Username:</label>
  <input type="text" id="username" th:field="*{username}" readonly="readonly" />
  <br />
  <label for="role">Role:</label>
  <input type="text" id="role" th:field="*{role}" />
  <br />
  <button type="submit">Update Profile</button>
</form>
<form th:action="@{/profile/change-password}" method="post">
  <label for="oldPassword">Old Password:</label>
  <input type="password" id="oldPassword" name="oldPassword" required />
  <br />
  <label for="newPassword">New Password:</label>
  <input type="password" id="newPassword" name="newPassword" required />
  <br />
  <button type="submit">Change Password</button>
</form>
<form th:action="@{/profile/delete}" method="post">
  <button type="submit">Delete Account</button>
</form>
</body>
</html>
